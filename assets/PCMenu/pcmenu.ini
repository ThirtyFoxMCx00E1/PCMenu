; PCMenu settings (all optional)
Enabled=1
; PC style Options / Start Game / Load / Delete screens. 0 = keep the stock screens
PCOptions=1
; 1 = also put a MODS entry (list of every file in mods/) into the pause and title menu.
; Off by default since 1.1.3: Options -> Mods settings already has it.
ShowModsInMenu=0
Sounds=1
; 0.5 - 2.0, scales item text and row spacing
Scale=1.0
Background=back8.png
; Language of the PC menu's own texts.
;   Auto       = the game's language (English, French, German, Italian, Spanish)
;   Indonesian = Bahasa Indonesia
;   Arabic     = Arabic (right to left; needs pc/fonts/bank_ar.* and beck_ar.* from this package)
; The game has no Indonesian or Arabic text file: only what the PC menu draws is translated -
; unless you add INDONESIAN.GXT (see below): then Indonesian also covers the game's own texts.
; Also switchable in game: Options > Language > BAHASA INDONESIA / the Arabic row (picking any other language there goes back to Auto).
Language=Auto
; Arabic only (1.1.8): 1 = mirror the whole layout right to left (labels at the right, values / sliders at the left, the arrow at the
; right) - the default. 0 = keep the usual PC layout (labels at the left, values at the right) and only the letters are Arabic.
ArabicMirror=1

; Indonesian game texts (1.1.9): put your Indonesian text file (the game's GXT format, 16 bit as in the Android game, or 8 bit as in the PC
; game) into this folder as INDONESIAN.GXT. While the PC menu language is Indonesian, subtitles, mission text, HUD names, help messages and
; the stock menu texts then come from that file; a text the file does not have stays in the game's language.
; 1 = use the file when it exists (default), 0 = never.
IndonesianText=1
; 1 = write idgxt_missing.txt (next to this file): every text the game asked for that INDONESIAN.GXT does not have, once, with the game's wording.
; Useful to see what is still untranslated. 0 = do not write it.
IndonesianTextLog=1

; ---------------------------------------------------------------------------------------------
; 1.2.0
; ---------------------------------------------------------------------------------------------
; Language system: every text of the PC menu (also the options other mods add) goes through one translator:
;   your own file lang/<fr|de|it|es|id|ar>.txt  ->  built-in dictionary  ->  patterns ("ENABLE %s", "%s VOLUME", ...)
;   ->  word by word. Add a line ENGLISH TEXT=TRANSLATION to lang/<code>.txt to fix or add any wording (see lang/README.txt).
; 1 = write lang_missing.txt (next to this file): every text that could not be translated, once. 0 = do not write it.
LangMissingLog=1

; Controller / keyboard: D-pad or stick up / down = select, left / right = change a value, A = accept, B = back.
Controller=1

; Transparent menu (only libPCMenuT32.so / libPCMenuT64.so): the paused game shows, blurred and darkened, behind the menu.
Transparent=1
TransparentBlur=1
; 0 - 255: how dark the game picture is behind the menu
TransparentDim=150
; the game frame is copied every N-th frame while you play (1 = every frame; higher = cheaper)
CaptureInterval=2
; 1 if the game picture appears upside down on your device
TransparentFlipY=0

; PC style loading screen: pictures pc/lds/mobilesc<N>.png (1024x512) from SplashFirst to SplashLast, one every SplashSeconds,
; with a crossfade. Missing numbers are skipped (mobilesc0..23 ship; drop mobilesc24..27.png in to use them).
LoadingScreen=1
SplashFirst=0
SplashLast=27
SplashSeconds=5
; Sequential or Random
Order=Sequential
; how the picture is shown: PC = framed in black like the PC game (default), Fit = as large as fits, Fill = cover the screen (crops)
SplashFit=PC
; pictures prepared per loading screen (1 - 8). They are loaded before the loading screen starts (never during it); each
; loading screen continues with the next pictures, so all of them come round.
SplashPreload=3
; PC style progress bar: thin grey bar with a black outline right under the San Andreas logo (no text, no background)
ProgressBar=1
; 1 = play ldsc.mp3 (this folder) while loading
LoadingMusic=0
; 1 = if a function has no PLT slot in this libGTASA build, hook the function itself (only if a feature reports "skipped" in the log)
InlineHookFallback=0
